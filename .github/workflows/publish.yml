name: Deploy Quarto Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"), repos="https://cran.rstudio.com/")'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chromium for Mermaid
        run: quarto install chromium

      - name: Render Quarto Book (HTML only)
        run: quarto render docs/ --to html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
